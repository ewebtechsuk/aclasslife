worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream web_upstream {
    server web:3000;
  }

  upstream portal_upstream {
    server portal:3001;
  }

  upstream admin_upstream {
    server admin:3002;
  }

  upstream api_upstream {
    server api:4000;
  }

  server {
    listen 8080;
    server_name aclasslife.com;

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/ {
      proxy_pass http://portal_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /robots.txt {
      proxy_pass http://web_upstream/robots.txt;
      proxy_set_header Host $host;
    }

    location /sitemap.xml {
      proxy_pass http://web_upstream/sitemap.xml;
      proxy_set_header Host $host;
    }

    # Legacy WordPress redirects (expand with actual URLs after audit)
    location = /blog {
      return 301 https://aclasslife.com/;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
